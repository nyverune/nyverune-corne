name: Build & Release Firmware

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Nyverune Corne Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install QMK CLI & Toolchain Dependencies
        run: |
          python3 -m pip install --upgrade pip qmk
          sudo apt-get update
          sudo apt-get install -y gcc-avr avr-libc gcc-arm-none-eabi libnewlib-arm-none-eabi

      - name: Setup QMK Firmware Repository
        run: |
          qmk setup -y -H /home/runner/qmk_firmware

      - name: Symlink Nyverune Keymaps
        run: |
          mkdir -p /home/runner/qmk_firmware/keyboards/crkbd/keymaps
          ln -s "$GITHUB_WORKSPACE/firmware/keymaps/nyverune" /home/runner/qmk_firmware/keyboards/crkbd/keymaps/nyverune
          ln -s "$GITHUB_WORKSPACE/firmware/keymaps/everyday" /home/runner/qmk_firmware/keyboards/crkbd/keymaps/nyverune_everyday
          ln -s "$GITHUB_WORKSPACE/firmware/keymaps/neovim" /home/runner/qmk_firmware/keyboards/crkbd/keymaps/nyverune_neovim

      - name: Compile Unified Firmware for RP2040 (Pro Micro RP2040 / CE)
        run: |
          cd /home/runner/qmk_firmware
          qmk compile -kb crkbd/rev1 -km nyverune -e CONVERT_TO=rp2040_ce
          cp .build/crkbd_rev1_nyverune_rp2040_ce.uf2 $GITHUB_WORKSPACE/crkbd_rev1_nyverune_rp2040.uf2

      - name: Compile Unified Firmware for ATmega32U4 (Classic Pro Micro)
        run: |
          cd /home/runner/qmk_firmware
          qmk compile -kb crkbd/rev1 -km nyverune
          cp .build/crkbd_rev1_nyverune.hex $GITHUB_WORKSPACE/crkbd_rev1_nyverune_atmega32u4.hex

      - name: Determine Release Tag
        id: release_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release with Binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: Nyverune Corne Firmware ${{ steps.release_tag.outputs.tag }}
          body: |
            ## Nyverune Corne Firmware Release ${{ steps.release_tag.outputs.tag }}
            
            Unified firmware for the **Corne (crkbd) 3x6+3** split keyboard featuring native **Latin American Spanish QWERTY** mapping and dynamic runtime switching between **Everyday** and **Neovim** profiles.

            ### Included Binaries:
            * **`crkbd_rev1_nyverune_rp2040.uf2`**: For **RP2040** microcontrollers (Raspberry Pi RP2 / Pro Micro RP2040 / SparkFun PM2040).
              * *Installation:* Double-tap the physical reset button to mount the `RPI-RP2` drive and drag & drop the `.uf2` file.
            * **`crkbd_rev1_nyverune_atmega32u4.hex`**: For classic **ATmega32U4** microcontrollers (Pro Micro 5V/16MHz or 3.3V/8MHz).
              * *Installation:* Flash using QMK Toolbox or `avrdude`.

            ### Highlights & Features:
            * Complete native Latin American Spanish symbols (`!"$%&/()=¬^`´+-~*<>_:;¡¿?@#{}\[]`).
            * Unified single firmware image containing both **Everyday** and **Neovim** profiles.
            * Hardware dynamic switching: Hold both center thumb keys (`ADJUST`) + `E` (Everyday), `N` (Neovim), or `D` / Outer Thumb (Toggle).
            * Custom OLED display: Pixel-art Nyverune Corne logo on the right half, real-time profile/layer telemetry on the left half.
            * Tuned dual-role timings: Generous tap windows for AltGr (380ms) and Control/Enter/Escape (260ms).
          files: |
            crkbd_rev1_nyverune_rp2040.uf2
            crkbd_rev1_nyverune_atmega32u4.hex
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
